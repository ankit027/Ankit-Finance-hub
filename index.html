<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ankit Finance Hub</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header>
  <button id="menuBtn">☰</button>

  <h1>💰 Ankit Finance Hub</h1>

  <div class="headerRight">
    <button id="themeBtn" class="themeBtn">🌙 Dark</button>
    <span id="status">☁️ Connecting...</span>
  </div>
</header>


<aside id="sidebar">

  <button data-page="dashboard">🏠 Dashboard</button>

  <button data-page="passbook">📒 Passbook</button>

  <button data-page="salary">💰 Salary</button>

  <button data-page="loans">🏦 Loans & EMI</button>

  <button data-page="give">🤝 Give & Take</button>

  <button data-page="splitter">🧮 Money Splitter</button>

  <button data-page="investments">📈 Investments & SIP</button>

</aside>


<main>


<!-- ================= DASHBOARD ================= -->

<section id="dashboard" class="page active">

  <h2>🏠 Financial Dashboard</h2>

  <div id="dash" class="cards"></div>


  <div class="charts-grid">

    <div class="chart-box">
      <h3>📊 Income vs Expense</h3>
      <canvas id="incomeExpenseChart"></canvas>
    </div>

    <div class="chart-box">
      <h3>🥧 Expense Categories</h3>
      <canvas id="expenseCategoryChart"></canvas>
    </div>

    <div class="chart-box">
      <h3>📈 Salary History</h3>
      <canvas id="salaryChart"></canvas>
    </div>

    <div class="chart-box">
      <h3>🏦 EMI History</h3>
      <canvas id="emiChart"></canvas>
    </div>

  </div>

  <button onclick="loadAll()">🔄 Refresh Cloud Data</button>

</section>



<!-- ================= PASSBOOK ================= -->

<section id="passbook" class="page">

<h2>📒 Passbook</h2>

<div class="form">

<input id="pbDate" type="date">

<select id="pbType">
<option>Expense</option>
<option>Income</option>
</select>

<input id="pbCat" list="categorySuggestions" placeholder="Category">

<datalist id="categorySuggestions"></datalist>

<input id="pbAmt" type="number" placeholder="Amount">

<input id="pbAccount" list="accountSuggestions" placeholder="Account / UPI / Cash">

<datalist id="accountSuggestions"></datalist>

<input id="pbRemarks" list="remarkSuggestions" placeholder="Remarks">

<datalist id="remarkSuggestions"></datalist>

<button onclick="addPassbook()">Save</button>

</div>

<div id="pbList"></div>

</section>



<!-- ================= SALARY ================= -->

<section id="salary" class="page">

<h2>💰 Salary</h2>

<div class="form">

<input id="salMonth" type="month">

<input id="salCompany"
list="companySuggestions"
placeholder="Company">

<datalist id="companySuggestions"></datalist>

<input id="salAmount" type="number" placeholder="Amount">

<input id="salRemarks"
list="salaryRemarkSuggestions"
placeholder="Remarks">

<datalist id="salaryRemarkSuggestions"></datalist>

<button onclick="addSalary()">Save</button>

</div>

<div id="salaryList"></div>

</section>



<!-- ================= LOANS ================= -->

<section id="loans" class="page">

<h2>🏦 Loans & EMI</h2>

<div class="form">

<input id="loanName"
list="loanSuggestions"
placeholder="Loan Name">

<datalist id="loanSuggestions"></datalist>

<input id="loanInitial"
type="number"
placeholder="Initial Amount">

<input id="loanRemarks"
list="loanRemarkSuggestions"
placeholder="Remarks">

<datalist id="loanRemarkSuggestions"></datalist>

<button onclick="addLoan()">Add Loan</button>

</div>


<div class="form">

<select id="emiLoan"></select>

<input id="emiMonth" type="month">

<input id="emiAmount"
type="number"
placeholder="EMI Amount">

<input id="emiRemarks"
placeholder="Remarks">

<button onclick="addEmi()">Mark EMI Paid</button>

</div>


<div id="loanList"></div>

</section>



<!-- ================= GIVE TAKE ================= -->

<section id="give" class="page">

<h2>🤝 Give & Take</h2>

<div class="form">

<input id="gtPerson"
list="personSuggestions"
placeholder="Person">

<datalist id="personSuggestions"></datalist>

<select id="gtType">
<option>Give</option>
<option>Receive</option>
<option>Take</option>
<option>Pay</option>
</select>

<input id="gtAmount"
type="number"
placeholder="Amount">

<input id="gtDate"
type="date">

<input id="gtPurpose"
list="purposeSuggestions"
placeholder="Purpose">

<datalist id="purposeSuggestions"></datalist>

<input id="gtNotes"
placeholder="Notes">

<button onclick="addGive()">Save</button>

</div>

<div id="gtList"></div>

</section>



<!-- ================= MONEY SPLITTER ================= -->

<section id="splitter" class="page">

<h2>🧮 Money Splitter</h2>

<h3>Create Group</h3>

<div class="form">

<input id="spGroup"
list="groupSuggestions"
placeholder="Group Name">

<datalist id="groupSuggestions"></datalist>

<select id="spCat">
<option>Trip</option>
<option>Food</option>
<option>Party</option>
<option>Other</option>
</select>

<input id="spMembers"
placeholder="Members: Ankit, Chirag, Rahul">

<button onclick="addGroup()">
Create Group
</button>

</div>


<h3>Add Expense</h3>

<div class="form">

<select id="spGroupSel"></select>

<input id="spTitle"
placeholder="Hotel / Dinner">

<input id="spAmount"
type="number"
placeholder="Amount">

<select id="spPaidBy"></select>

<input id="spMembersSel"
placeholder="Members (blank = all)">

<button onclick="addSplitExpense()">
Save Expense
</button>

</div>


<div id="splitList"></div>

</section>



<!-- ================= INVESTMENT ================= -->

<section id="investments" class="page">

<h2>📈 Investment & SIP</h2>


<div class="form">

<input id="sipPerson"
list="investmentPersonSuggestions"
placeholder="Person">

<datalist id="investmentPersonSuggestions"></datalist>

<input id="sipBasket"
list="basketSuggestions"
placeholder="Basket Name">

<datalist id="basketSuggestions"></datalist>

<button onclick="addBasket()">
Create Basket
</button>

</div>


<div class="form">

<select id="assetBasket"></select>

<input id="assetName"
list="assetSuggestions"
placeholder="ETF / Mutual Fund">

<datalist id="assetSuggestions"></datalist>

<select id="assetType">
<option>ETF</option>
<option>Mutual Fund</option>
<option>Stock</option>
<option>Gold</option>
<option>Other</option>
</select>

<input id="assetAmount"
type="number"
placeholder="Monthly Amount">

<button onclick="addAsset()">
Add Asset
</button>

</div>


<div id="basketList"></div>

</section>


</main>


<div id="toast"></div>

<script src="app.js"></script>

</body>
</html>
